{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Forgot password</h2>
    <p>Enter the email address on your account. If it exists, we will email you a one-time reset link.</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Email
            <input type="email" name="email" required autocomplete="email">
        </label>
        <button type="submit">Send reset link</button>
    </form>
</div>
{% endblock %}
